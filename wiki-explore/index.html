<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pages-lab-ai — Wikipedia explorer (copilot)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; height: 100%; }
  body { height: 100%; }
  img, picture, video, canvas, svg { display: block; max-width: 100%; }
  input, button, textarea, select { font: inherit; }
  p, h1, h2, h3 { overflow-wrap: break-word; }

  :root {
    --bg: #ffffff;
    --fg: #111111;
    --muted: #555555;
    --border: #dddddd;
    --accent: #0a58ca;
    --accent-fg: #ffffff;
    --panel: #f6f8fa;
    --ok: #1a7f37;
    --warn: #9a6700;
    --bad: #cf222e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #9aa4af;
      --border: #30363d;
      --accent: #6ea8fe;
      --accent-fg: #0d1117;
      --panel: #161b22;
      --ok: #3fb950;
      --warn: #d29922;
      --bad: #ff7b72;
    }
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
    height: 100%;
    overflow: hidden;
  }

  #app {
    display: grid;
    grid-template-columns: 1fr 6px 380px;
    /* Without this, the grid's implicit single row auto-sizes to fit its
       content instead of stretching to the container's own height -- the
       real cause of the scroll bug: #chat-pane grew as tall as its
       messages needed (well past the viewport) rather than being capped
       at 100dvh, so #chat-log's flex:1/overflow-y:auto never had a fixed
       height to actually overflow within. minmax(0, 1fr) forces the row
       to the available height and lets it shrink below content size. */
    grid-template-rows: minmax(0, 1fr);
    height: 100vh;
    height: 100dvh;
  }

  #splitter {
    grid-column: 2;
    background: var(--border);
    cursor: col-resize;
    position: relative;
  }
  /* Widen the real hit-area past the visible 6px line via a transparent
     pseudo-element, so the drag target isn't uncomfortably thin. */
  #splitter::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    left: -4px; right: -4px;
  }
  #splitter:hover, #splitter.dragging { background: var(--accent); }

  #article-pane { overflow-y: auto; padding: 2rem clamp(1rem, 4vw, 3rem); }
  #article-header { margin-bottom: 1.25rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
  #article-header h1 { font-size: 1.5rem; margin-bottom: 0.35rem; }
  .top-subnote { color: var(--muted); font-size: 0.82rem; margin-bottom: 1.25rem; }
  .attribution { color: var(--muted); font-size: 0.78rem; margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--border); }
  .attribution a { color: inherit; }

  #article-body h2 { font-size: 1.2rem; margin: 1.5rem 0 0.5rem; }
  #article-body h3 { font-size: 1.05rem; margin: 1.2rem 0 0.4rem; }
  #article-body h4 { font-size: 0.95rem; margin: 1rem 0 0.35rem; color: var(--muted); }
  #article-body p { margin-bottom: 0.85rem; font-size: 0.95rem; }
  #article-intro { font-size: 1rem; margin-bottom: 0.5rem; }

  #chat-pane {
    display: flex;
    flex-direction: column;
    height: 100%;
    border-left: 1px solid var(--border);
    background: var(--panel);
    min-width: 0;
  }
  #chat-header { flex-shrink: 0; padding: 1rem 1rem 0.75rem; border-bottom: 1px solid var(--border); }
  #chat-header h2 { font-size: 0.95rem; margin-bottom: 0.3rem; }
  #chat-header .status-line { font-size: 0.78rem; color: var(--muted); }
  .status-pill { font-weight: 600; }
  .status-pill.available { color: var(--ok); }
  .status-pill.downloadable, .status-pill.unavailable { color: var(--bad); }

  #chat-log { flex: 1; min-height: 0; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
  .msg { padding: 0.6rem 0.85rem; border-radius: 10px; max-width: 92%; font-size: 0.88rem; }
  .msg.user { align-self: flex-end; background: color-mix(in srgb, var(--accent) 15%, var(--panel)); }
  .msg.assistant { align-self: flex-start; background: var(--bg); border: 1px solid var(--border); }
  .msg .role { display: block; font-size: 0.7rem; color: var(--muted); margin-bottom: 0.2rem; }
  .msg.section-note { align-self: center; background: transparent; border: none; color: var(--muted); font-size: 0.78rem; font-style: italic; padding: 0.2rem; }
  .msg .md > *:first-child { margin-top: 0; }
  .msg .md > *:last-child { margin-bottom: 0; }
  .msg .md p, .msg .md ul, .msg .md ol { margin: 0.5rem 0; }
  .msg .md ul, .msg .md ol { padding-left: 1.25rem; }
  .msg .md code { background: color-mix(in srgb, var(--fg) 10%, transparent); border-radius: 4px; padding: 0.1rem 0.3rem; font-size: 0.85em; }
  .msg .md pre { background: color-mix(in srgb, var(--fg) 8%, transparent); border-radius: 6px; padding: 0.6rem; overflow-x: auto; margin: 0.5rem 0; }
  .msg .md pre code { background: none; padding: 0; }
  .msg.starter { align-self: stretch; max-width: 100%; background: var(--bg); border: 1px dashed var(--border); }
  .msg.starter details { margin-top: 0.5rem; }
  .msg.starter summary { cursor: pointer; font-weight: 600; font-size: 0.85rem; padding: 0.25rem 0; }
  .msg.starter details ul { margin: 0.4rem 0 0; }
  .msg.starter details ul ul { margin-left: 1rem; }

  #chat-composer { flex-shrink: 0; padding: 0.85rem; border-top: 1px solid var(--border); }
  #chat-composer .row { display: flex; gap: 0.5rem; }
  #chat-input { flex: 1; border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 0.7rem; background: var(--bg); color: var(--fg); font-size: 0.88rem; }
  button {
    background: var(--accent); color: var(--accent-fg); border: none; border-radius: 6px;
    padding: 0.5rem 0.9rem; cursor: pointer; font-size: 0.88rem;
  }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  #chat-note { color: var(--muted); font-size: 0.78rem; margin-top: 0.5rem; min-height: 1.1em; }

  @media (max-width: 800px) {
    #app { grid-template-columns: 1fr !important; grid-template-rows: 1fr 45vh; height: 100vh; height: 100dvh; }
    #splitter { display: none; }
    #chat-pane { border-left: none; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>
  <div id="app">
    <div id="article-pane">
      <div id="article-header">
        <h1 id="article-title">Loading…</h1>
        <p class="top-subnote">Wikipedia explorer — <a href="https://github.com/nlade-core/pages-lab-ai" target="_blank" rel="noopener">pages-lab-ai</a>, 15th page. Rendered from Wikipedia's own plain-text extract; ask the sidebar copilot anything about it.</p>
      </div>
      <div id="article-intro"></div>
      <div id="article-body"></div>
      <p class="attribution" id="attribution" style="display:none;"></p>
    </div>

    <div id="splitter" title="Drag to resize"></div>

    <div id="chat-pane">
      <div id="chat-header">
        <h2>Ask about this article</h2>
        <div class="status-line">Prompt API: <span class="status-pill" id="status-pill">checking…</span></div>
      </div>
      <div id="chat-log"></div>
      <div id="chat-composer">
        <div class="row">
          <input type="text" id="chat-input" placeholder="Ask something…" disabled>
          <button id="chat-send-btn" disabled>Ask</button>
        </div>
        <div id="chat-note"></div>
      </div>
    </div>
  </div>

  <script type="module">
    // Pinned to an exact version deliberately, same reasoning as every
    // other CDN import across pages-lab-ai.
    import { marked } from 'https://cdn.jsdelivr.net/npm/marked@18.0.11/lib/marked.esm.js';

    const ARTICLE_TITLE = 'Eiffel Tower';

    const articleTitleEl = document.getElementById('article-title');
    const articleIntroEl = document.getElementById('article-intro');
    const articleBodyEl = document.getElementById('article-body');
    const attributionEl = document.getElementById('attribution');
    const statusPill = document.getElementById('status-pill');
    const chatLog = document.getElementById('chat-log');
    const chatInput = document.getElementById('chat-input');
    const chatSendBtn = document.getElementById('chat-send-btn');
    const chatNote = document.getElementById('chat-note');

    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    // Escape first, then Markdown-parse the escaped text -- markdown's own
    // syntax never uses &, <, or >, so this doesn't break formatting, and
    // any literal HTML in the model's raw output renders as inert visible
    // text instead of executable markup. Same pattern as chrome-ai's own
    // chat demo, not something to solve differently here.
    function renderMarkdown(text) {
      return '<div class="md">' + marked.parse(escapeHtml(text)) + '</div>';
    }

    // --- Fetch + parse the article once. Plain-text extract, not HTML --
    // deliberately: this is the same data source the retrieval loop below
    // needs anyway (real section text on demand), so the reading pane and
    // the copilot share one source of truth instead of fetching the
    // article twice in two different formats.
    async function fetchArticle(title) {
      const res = await fetch('https://en.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&titles=' + encodeURIComponent(title) + '&format=json&origin=*');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const page = Object.values(data.query.pages)[0];
      const extract = page.extract || '';
      const { intro, tree } = parseArticleTree(extract);
      return { title: page.title, intro, tree };
    }

    // --- A real parent/child tree, not a flat list with a level number
    // bolted on. This matters for two reasons: (1) a subsection's own text
    // is often thin -- the real content usually lives one level deeper --
    // so injecting "a section" should mean its whole subtree, not just its
    // own paragraph; (2) two different subsections that happen to share a
    // name (e.g. two "Overview"s under different parents) need their path
    // to tell them apart, which a flat list can't express. ---
    function parseArticleTree(extract) {
      const lines = extract.split('\n');
      const root = { title: null, level: 1, ownText: '', children: [] };
      const stack = [root];
      let intro = '';
      for (const line of lines) {
        const m = line.match(/^(={2,6})\s*(.+?)\s*\1$/);
        if (m) {
          const level = m[1].length;
          while (stack.length > 1 && stack[stack.length - 1].level >= level) stack.pop();
          const node = { title: m[2].trim(), level, ownText: '', children: [] };
          stack[stack.length - 1].children.push(node);
          stack.push(node);
        } else if (stack.length > 1) {
          const top = stack[stack.length - 1];
          top.ownText += (top.ownText ? '\n' : '') + line;
        } else {
          intro += (intro ? '\n' : '') + line;
        }
      }
      // Citations/links-only tail sections aren't useful reading or
      // retrieval content -- stop there, same convention as chrome-chat's
      // /wiki full. Only checked at the top level; a nested section that
      // happens to share one of these names is left alone.
      const stop = ['See also', 'References', 'External links', 'Notes', 'Further reading', 'Bibliography'];
      const stopIdx = root.children.findIndex((s) => stop.includes(s.title));
      const kept = stopIdx === -1 ? root.children : root.children.slice(0, stopIdx);
      kept.forEach(annotateCounts);
      return { intro: intro.trim(), tree: kept };
    }

    // Own text length, and a total including every descendant -- the
    // total is what actually gets pasted into the model's context when
    // this node is chosen (see getSubtreeText), so that's the number that
    // matters for judging how much a retrieval hop will cost. Own count
    // is kept too, as the natural seed for chunking a section later if an
    // article ever has one large enough to need it.
    function annotateCounts(node) {
      node.ownCharCount = node.ownText.length;
      node.totalCharCount = node.ownCharCount + node.children.reduce((sum, c) => sum + annotateCounts(c), 0);
      return node.totalCharCount;
    }

    function renderNode(node) {
      const tag = 'h' + Math.min(node.level, 4);
      const body = node.ownText.split('\n\n').filter(Boolean).map((p) => '<p>' + escapeHtml(p) + '</p>').join('');
      const childHtml = node.children.map(renderNode).join('');
      return '<' + tag + '>' + escapeHtml(node.title) + '</' + tag + '>' + body + childHtml;
    }

    function renderArticle(article) {
      articleTitleEl.textContent = article.title;
      articleIntroEl.innerHTML = article.intro.split('\n\n').map((p) => '<p>' + escapeHtml(p) + '</p>').join('');
      articleBodyEl.innerHTML = article.tree.map(renderNode).join('');
      attributionEl.innerHTML = 'Content from <a href="https://en.wikipedia.org/wiki/' + encodeURIComponent(article.title.replace(/ /g, '_')) + '" target="_blank" rel="noopener">Wikipedia: ' + escapeHtml(article.title) + '</a>, available under the <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a> license.';
      attributionEl.style.display = 'block';
    }

    // --- The retrieval loop. Gemini Nano has no native tool-calling, so
    // this is hand-rolled in stages: try the summary alone first: only
    // if that's not enough does the model see the section tree at all,
    // and only the specific subtree(s) it picks ever get their full text
    // injected. ---
    const RANK_COUNT = 3;

    function buildSystemPrompt(article) {
      return 'You are a helpful assistant answering questions about the Wikipedia article "' + article.title + '".\n\n'
        + 'Summary:\n' + article.intro + '\n\n'
        + 'Try to answer the user\'s question using this summary alone. If you can answer it confidently and directly, just answer normally.\n\n'
        + 'If the summary genuinely isn\'t enough to answer well, respond with EXACTLY this and nothing else:\n'
        + 'NEED_MORE_INFO';
    }

    // Flattened on demand from the tree, not stored redundantly -- the
    // tree stays the one source of truth. `path` is the full ancestor
    // chain (including the node's own title), used both for showing the
    // model real hierarchy when ranking and for disambiguating same-named
    // subsections under different parents.
    function flattenWithPaths(nodes, ancestors) {
      ancestors = ancestors || [];
      let out = [];
      for (const node of nodes) {
        const path = ancestors.concat([node.title]);
        out.push({ node, path });
        out = out.concat(flattenWithPaths(node.children, path));
      }
      return out;
    }

    // The full text of a node and everything nested under it, rendered
    // back out with the same == heading markers the source extract used
    // -- so a subsection's own heading, and any of ITS children, stay
    // visibly structured rather than arriving as one flat undifferentiated
    // block of text.
    function getSubtreeText(node) {
      const marker = '='.repeat(Math.min(node.level, 6));
      let text = marker + ' ' + node.title + ' ' + marker + (node.ownText ? '\n' + node.ownText : '');
      for (const child of node.children) {
        text += '\n\n' + getSubtreeText(child);
      }
      return text;
    }

    function findNode(flatList, requestedTitle) {
      const norm = requestedTitle.trim().toLowerCase();
      let hit = flatList.find((f) => f.path.join(' > ').toLowerCase() === norm);
      if (hit) return hit;
      hit = flatList.find((f) => f.node.title.toLowerCase() === norm);
      if (hit) return hit;
      return flatList.find((f) => f.node.title.toLowerCase().includes(norm) || norm.includes(f.node.title.toLowerCase()));
    }

    function buildRankingPrompt(question, flatList) {
      const lines = flatList.map((f) => '- ' + f.path.join(' > ') + ' (~' + f.node.totalCharCount + ' chars)');
      return 'The summary wasn\'t enough to answer this question: "' + question + '"\n\n'
        + 'Here are the article\'s sections, with a rough size in characters:\n' + lines.join('\n') + '\n\n'
        + 'List up to ' + RANK_COUNT + ' sections most likely to contain the answer, in priority order, using their exact names from the list above (fewer than ' + RANK_COUNT + ' is fine if fewer seem relevant). Respond with EXACTLY this format and nothing else:\n'
        + 'RANK: <first choice> | <second choice> | <third choice>';
    }

    function parseRankResponse(response, flatList) {
      const m = response.match(/^RANK:\s*(.+)$/is);
      if (!m) return [];
      const names = m[1].split('|').map((s) => s.trim()).filter(Boolean).slice(0, RANK_COUNT);
      const hits = [];
      for (const name of names) {
        const hit = findNode(flatList, name);
        if (hit && !hits.includes(hit)) hits.push(hit);
      }
      return hits;
    }

    // --- Resizable article/chat split. Grid column widths, not flex-basis,
    // since #app is already a grid (see the scroll-bug comment above) --
    // keeping one layout mechanism for the outer shell rather than mixing
    // in a second. Persisted so a visitor's preferred split survives a
    // reload, same convenience as everything else in this family that
    // remembers state in localStorage. ---
    const splitter = document.getElementById('splitter');
    const app = document.getElementById('app');
    const CHAT_WIDTH_KEY = 'wiki-explore:chat-width-px';
    const SPLITTER_W = 6;
    const MIN_CHAT = 260;
    const MIN_ARTICLE = 320;

    function clampChatWidth(px) {
      const maxChat = window.innerWidth - MIN_ARTICLE - SPLITTER_W;
      return Math.max(MIN_CHAT, Math.min(px, Math.max(MIN_CHAT, maxChat)));
    }
    function applyChatWidth(px) {
      app.style.gridTemplateColumns = '1fr ' + SPLITTER_W + 'px ' + px + 'px';
    }
    (function restoreChatWidth() {
      const saved = parseInt(localStorage.getItem(CHAT_WIDTH_KEY), 10);
      if (!Number.isNaN(saved)) applyChatWidth(clampChatWidth(saved));
    })();

    let dragStartX = null;
    let dragStartWidth = null;
    function beginDrag(clientX) {
      if (window.innerWidth <= 800) return;
      dragStartX = clientX;
      dragStartWidth = document.getElementById('chat-pane').getBoundingClientRect().width;
      splitter.classList.add('dragging');
      document.body.style.userSelect = 'none';
    }
    function duringDrag(clientX) {
      if (dragStartX === null) return;
      const delta = dragStartX - clientX;
      applyChatWidth(clampChatWidth(dragStartWidth + delta));
    }
    function endDrag() {
      if (dragStartX === null) return;
      dragStartX = null;
      splitter.classList.remove('dragging');
      document.body.style.userSelect = '';
      const rect = document.getElementById('chat-pane').getBoundingClientRect();
      localStorage.setItem(CHAT_WIDTH_KEY, String(Math.round(rect.width)));
    }
    splitter.addEventListener('mousedown', (e) => { beginDrag(e.clientX); e.preventDefault(); });
    window.addEventListener('mousemove', (e) => duringDrag(e.clientX));
    window.addEventListener('mouseup', endDrag);
    splitter.addEventListener('touchstart', (e) => beginDrag(e.touches[0].clientX), { passive: true });
    window.addEventListener('touchmove', (e) => duringDrag(e.touches[0].clientX), { passive: true });
    window.addEventListener('touchend', endDrag);

    function addMessage(role, text) {
      const row = document.createElement('div');
      row.className = 'msg ' + role;
      row.innerHTML = '<span class="role">' + role + '</span>' + renderMarkdown(text);
      chatLog.appendChild(row);
      chatLog.scrollTop = chatLog.scrollHeight;
    }
    // Shown as soon as the article is fetched/parsed (see init() below --
    // deliberately not gated on the model finishing its own, possibly much
    // slower, load). The model only ever sees the summary up front in its
    // own system prompt (section titles are shown later, only if a
    // question actually escalates to ranking -- see buildSystemPrompt
    // above), so this is the visitor's one guaranteed look at the full
    // section map regardless of whether their questions ever trigger that
    // escalation. Summary open by default (short, worth reading
    // immediately); Sections collapsed (a full tree is a lot to scroll
    // past unopened). The markup stays real HTML (not run through
    // renderMarkdown/marked) since it's plain Wikipedia text, not model
    // output that needs markdown parsing. Nested <ul>s mirror the real
    // tree, not a flattened dump -- a subsection renders indented under
    // its parent instead of appearing as just another same-level bullet.
    function renderSectionList(nodes) {
      return '<ul>' + nodes.map((n) => '<li>' + escapeHtml(n.title) + (n.children.length ? renderSectionList(n.children) : '') + '</li>').join('') + '</ul>';
    }
    function addStarterMessage(article) {
      const introHtml = article.intro.split('\n\n').filter(Boolean).map((p) => '<p>' + escapeHtml(p) + '</p>').join('');
      const totalCount = flattenWithPaths(article.tree).length;
      const html = '<p>I\'ve loaded <strong>' + escapeHtml(article.title) + '</strong> -- ask me anything, or check what I know below:</p>'
        + '<details open><summary>Summary</summary>' + introHtml + '</details>'
        + '<details><summary>Sections (' + totalCount + ')</summary>' + renderSectionList(article.tree) + '</details>';
      const row = document.createElement('div');
      row.className = 'msg starter';
      row.innerHTML = '<div class="md">' + html + '</div>';
      chatLog.appendChild(row);
      chatLog.scrollTop = chatLog.scrollHeight;
    }
    function addSectionNote(text) {
      const row = document.createElement('div');
      row.className = 'msg section-note';
      row.textContent = text;
      chatLog.appendChild(row);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    let session = null;
    let article = null;

    // v1 deliberately uses non-streaming prompt() throughout, not
    // promptStreaming(). Streaming would mean rendering chunks live as
    // they arrive -- but a marker like NEED_MORE_INFO or RANK: looks
    // identical to the start of a real answer until enough of it has
    // streamed in, risking raw control text flashing on screen before the
    // app catches it. Waiting for the complete response first makes every
    // marker check unambiguous. Real streaming is a follow-up once this
    // retrieval logic itself is proven out, not something to solve at
    // the same time.
    //
    // Three stages, escalating only as far as needed:
    //   0. The question goes in with just the summary in context (already
    //      in the system prompt). Most questions stop here.
    //   1. If the model says NEED_MORE_INFO, it's shown the full section
    //      tree (titles + rough sizes, not content) and asked to rank the
    //      top few most likely to help.
    //   2. Those ranked sections are injected one at a time, most likely
    //      first, checking after each whether that's now enough to
    //      answer -- stopping as soon as it is, and forcing a final
    //      answer once the last rank is exhausted so this can never dead-
    //      end without a response.
    async function askQuestion(question) {
      chatInput.value = '';
      chatSendBtn.disabled = true;
      chatInput.disabled = true;
      addMessage('user', question);
      chatNote.textContent = 'Checking the summary…';
      try {
        const response = await session.prompt(question);
        if (!/^NEED_MORE_INFO\b/i.test(response.trim())) {
          addMessage('assistant', response);
          chatNote.textContent = '';
        } else {
          await escalate(question);
        }
      } catch (e) {
        chatNote.textContent = 'Error: ' + e.message;
      }
      chatSendBtn.disabled = false;
      chatInput.disabled = false;
      chatInput.focus();
    }

    async function escalate(question) {
      addSectionNote('Summary alone wasn\'t enough -- checking which sections might help…');
      chatNote.textContent = 'Ranking sections…';
      const flatList = flattenWithPaths(article.tree);
      const rankResponse = await session.prompt(buildRankingPrompt(question, flatList));
      const ranked = parseRankResponse(rankResponse, flatList);

      let finalResponse;
      if (ranked.length === 0) {
        addSectionNote('No clear section match -- answering with what\'s available.');
        finalResponse = await session.prompt('There\'s no specific section to point to for this. Please answer as best you can with what you already know: ' + question);
      } else {
        for (let i = 0; i < ranked.length; i++) {
          const { node, path } = ranked[i];
          const pathStr = path.join(' > ');
          const isLast = i === ranked.length - 1;
          addSectionNote('Checking "' + pathStr + '" (' + (i + 1) + '/' + ranked.length + ')…');
          chatNote.textContent = 'Checking "' + pathStr + '"…';
          const sectionBlock = 'Section path: ' + pathStr + '\n\n' + getSubtreeText(node);
          const prompt = isLast
            ? sectionBlock + '\n\nNow answer the original question as best you can using everything you\'ve seen so far: ' + question
            : sectionBlock + '\n\nDoes this let you answer the original question ("' + question + '") satisfactorily?\nIf yes, respond with EXACTLY: ANSWER: <your answer>\nIf not, respond with EXACTLY: NEED_MORE_INFO (and nothing else).';
          const stepResponse = await session.prompt(prompt);
          if (isLast) { finalResponse = stepResponse; break; }
          const ansMatch = stepResponse.match(/^ANSWER:\s*([\s\S]+)$/i);
          finalResponse = ansMatch ? ansMatch[1].trim() : stepResponse;
          if (ansMatch) break;
        }
      }
      addMessage('assistant', finalResponse);
      chatNote.textContent = '';
    }

    async function init() {
      try {
        article = await fetchArticle(ARTICLE_TITLE);
        renderArticle(article);
        // Shown the moment the (fast) Wikipedia fetch is parsed -- doesn't
        // wait on the model, which can take much longer if it needs a
        // fresh download. The same summary/tree still gets fed to the
        // model as its priming context below; this just means the
        // visitor isn't staring at a blank chat pane in the meantime.
        addStarterMessage(article);
      } catch (e) {
        articleTitleEl.textContent = 'Failed to load article';
        chatNote.textContent = 'Error loading article: ' + e.message;
        return;
      }

      if (!self.LanguageModel) {
        statusPill.className = 'status-pill unavailable';
        statusPill.textContent = 'not in this browser';
        chatNote.textContent = 'The Prompt API isn\'t available in this browser.';
        return;
      }
      try {
        const availability = await LanguageModel.availability();
        if (availability === 'unavailable') {
          statusPill.className = 'status-pill unavailable';
          statusPill.textContent = 'unavailable';
          chatNote.textContent = 'The Prompt API is unavailable on this device.';
          return;
        }
        statusPill.className = 'status-pill ' + (availability === 'available' ? 'available' : 'downloadable');
        statusPill.textContent = availability === 'downloadable' ? 'needs download' : availability;

        chatNote.textContent = 'Preparing the model…';
        session = await LanguageModel.create({
          initialPrompts: [{ role: 'system', content: buildSystemPrompt(article) }],
          monitor(m) {
            m.addEventListener('downloadprogress', (e) => {
              chatNote.textContent = 'Downloading model… ' + Math.round(e.loaded * 100) + '%';
            });
          },
        });
        chatNote.textContent = '';
        chatInput.disabled = false;
        chatSendBtn.disabled = false;
        chatInput.focus();
      } catch (e) {
        chatNote.textContent = 'Could not start the model: ' + e.message;
      }
    }

    chatSendBtn.addEventListener('click', () => {
      const q = chatInput.value.trim();
      if (q && session) askQuestion(q);
    });
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const q = chatInput.value.trim();
        if (q && session) askQuestion(q);
      }
    });

    init();
  </script>
</body>
</html>
