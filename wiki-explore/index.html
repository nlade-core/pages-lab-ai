<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pages-lab-ai — Wikipedia explorer (copilot)</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; height: 100%; }
  body { height: 100%; }
  img, picture, video, canvas, svg { display: block; max-width: 100%; }
  input, button, textarea, select { font: inherit; }
  p, h1, h2, h3 { overflow-wrap: break-word; }

  :root {
    --bg: #ffffff;
    --fg: #111111;
    --muted: #555555;
    --border: #dddddd;
    --accent: #0a58ca;
    --accent-fg: #ffffff;
    --panel: #f6f8fa;
    --ok: #1a7f37;
    --warn: #9a6700;
    --bad: #cf222e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d1117;
      --fg: #e6edf3;
      --muted: #9aa4af;
      --border: #30363d;
      --accent: #6ea8fe;
      --accent-fg: #0d1117;
      --panel: #161b22;
      --ok: #3fb950;
      --warn: #d29922;
      --bad: #ff7b72;
    }
  }

  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height: 1.5;
    height: 100%;
    overflow: hidden;
  }

  #app {
    display: grid;
    grid-template-columns: 1fr 6px 380px;
    /* Without this, the grid's implicit single row auto-sizes to fit its
       content instead of stretching to the container's own height -- the
       real cause of the scroll bug: #chat-pane grew as tall as its
       messages needed (well past the viewport) rather than being capped
       at 100dvh, so #chat-log's flex:1/overflow-y:auto never had a fixed
       height to actually overflow within. minmax(0, 1fr) forces the row
       to the available height and lets it shrink below content size. */
    grid-template-rows: minmax(0, 1fr);
    height: 100vh;
    height: 100dvh;
  }

  #splitter {
    grid-column: 2;
    background: var(--border);
    cursor: col-resize;
    position: relative;
  }
  /* Widen the real hit-area past the visible 6px line via a transparent
     pseudo-element, so the drag target isn't uncomfortably thin. */
  #splitter::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    left: -4px; right: -4px;
  }
  #splitter:hover, #splitter.dragging { background: var(--accent); }

  #article-pane { overflow-y: auto; padding: 2rem clamp(1rem, 4vw, 3rem); }
  #article-header { margin-bottom: 1.25rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border); }
  #article-header h1 { font-size: 1.5rem; margin-bottom: 0.35rem; }
  .top-subnote { color: var(--muted); font-size: 0.82rem; margin-bottom: 1.25rem; }
  .attribution { color: var(--muted); font-size: 0.78rem; margin-top: 2rem; padding-top: 1rem; border-top: 1px solid var(--border); }
  .attribution a { color: inherit; }

  #lead-image { margin-bottom: 1.5rem; }
  #lead-image img { width: 100%; max-height: 320px; object-fit: cover; border-radius: 8px; }
  #lead-image figcaption { color: var(--muted); font-size: 0.78rem; margin-top: 0.4rem; }
  #lead-image figcaption a { color: inherit; }

  /* Wikipedia's own infobox CSS isn't included in the raw HTML response
     (it comes from a separate site-wide stylesheet) -- these rules give
     the injected real infobox markup a reasonable look using this page's
     own theme tokens, targeting the actual class names Wikipedia's
     infobox templates emit (confirmed live, not guessed). Demo-quality,
     not pixel-perfect. */
  #infobox-demo { margin-bottom: 1.5rem; max-width: 320px; }
  #infobox-demo table.infobox {
    width: 100%; border-collapse: collapse; font-size: 0.82rem;
    border: 1px solid var(--border); border-radius: 8px; overflow: hidden;
  }
  #infobox-demo .infobox-above, #infobox-demo .infobox-title {
    background: var(--panel); font-weight: 700; font-size: 0.95rem;
    text-align: center; padding: 0.5rem;
  }
  #infobox-demo .infobox-header, #infobox-demo .infobox-subheader {
    background: var(--panel); font-weight: 600; text-align: center; padding: 0.4rem;
  }
  #infobox-demo .infobox-image { text-align: center; padding: 0.5rem; }
  #infobox-demo .infobox-image img { max-width: 100%; height: auto; margin: 0 auto; }
  #infobox-demo .infobox-caption { text-align: center; color: var(--muted); font-size: 0.75rem; padding: 0.2rem 0.5rem 0.5rem; }
  #infobox-demo .infobox-label { color: var(--muted); padding: 0.3rem 0.5rem; vertical-align: top; width: 40%; border-top: 1px solid var(--border); }
  #infobox-demo .infobox-data, #infobox-demo .infobox-full-data { padding: 0.3rem 0.5rem; vertical-align: top; border-top: 1px solid var(--border); }
  #infobox-demo .infobox-full-data { text-align: center; }
  #infobox-demo a { color: var(--accent); }
  #infobox-demo table { max-width: 100%; }

  #article-body h2 { font-size: 1.2rem; margin: 1.5rem 0 0.5rem; }
  #article-body h3 { font-size: 1.05rem; margin: 1.2rem 0 0.4rem; }
  #article-body h4 { font-size: 0.95rem; margin: 1rem 0 0.35rem; color: var(--muted); }
  #article-body p { margin-bottom: 0.85rem; font-size: 0.95rem; }
  #article-intro { margin-bottom: 0.5rem; }
  #article-intro p { margin-bottom: 0.85rem; font-size: 0.95rem; }

  #chat-pane {
    display: flex;
    flex-direction: column;
    height: 100%;
    border-left: 1px solid var(--border);
    background: var(--panel);
    min-width: 0;
  }
  #chat-header { flex-shrink: 0; padding: 1rem 1rem 0.75rem; border-bottom: 1px solid var(--border); }
  #chat-header h2 { font-size: 0.95rem; margin-bottom: 0.3rem; }
  #chat-header .status-line { font-size: 0.78rem; color: var(--muted); }
  .status-pill { font-weight: 600; }
  .status-pill.available { color: var(--ok); }
  .status-pill.downloadable, .status-pill.unavailable { color: var(--bad); }

  #chat-log { flex: 1; min-height: 0; overflow-y: auto; padding: 1rem; display: flex; flex-direction: column; gap: 0.75rem; }
  .msg { padding: 0.6rem 0.85rem; border-radius: 10px; max-width: 92%; font-size: 0.88rem; }
  .msg.user { align-self: flex-end; background: color-mix(in srgb, var(--accent) 15%, var(--panel)); }
  .msg.assistant { align-self: flex-start; background: var(--bg); border: 1px solid var(--border); }
  .msg .role { display: block; font-size: 0.7rem; color: var(--muted); margin-bottom: 0.2rem; }
  .msg.section-note { align-self: center; background: transparent; border: none; color: var(--muted); font-size: 0.78rem; font-style: italic; padding: 0.2rem; }
  .msg .md > *:first-child { margin-top: 0; }
  .msg .md > *:last-child { margin-bottom: 0; }
  .msg .md p, .msg .md ul, .msg .md ol { margin: 0.5rem 0; }
  .msg .md ul, .msg .md ol { padding-left: 1.25rem; }
  .msg .md code { background: color-mix(in srgb, var(--fg) 10%, transparent); border-radius: 4px; padding: 0.1rem 0.3rem; font-size: 0.85em; }
  .msg .md pre { background: color-mix(in srgb, var(--fg) 8%, transparent); border-radius: 6px; padding: 0.6rem; overflow-x: auto; margin: 0.5rem 0; }
  .msg .md pre code { background: none; padding: 0; }
  .msg.starter { align-self: stretch; max-width: 100%; background: var(--bg); border: 1px dashed var(--border); }
  .msg.starter details { margin-top: 0.5rem; }
  .msg.starter summary { cursor: pointer; font-weight: 600; font-size: 0.85rem; padding: 0.25rem 0; }
  .msg.starter details ul { margin: 0.4rem 0 0; }
  .msg.starter details ul ul { margin-left: 1rem; }

  #chat-composer { flex-shrink: 0; padding: 0.85rem; border-top: 1px solid var(--border); }
  #chat-composer .row { display: flex; gap: 0.5rem; }
  #chat-input { flex: 1; border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 0.7rem; background: var(--bg); color: var(--fg); font-size: 0.88rem; }
  button {
    background: var(--accent); color: var(--accent-fg); border: none; border-radius: 6px;
    padding: 0.5rem 0.9rem; cursor: pointer; font-size: 0.88rem;
  }
  button:disabled { opacity: 0.45; cursor: not-allowed; }
  #chat-note { color: var(--muted); font-size: 0.78rem; margin-top: 0.5rem; min-height: 1.1em; }

  @media (max-width: 800px) {
    #app { grid-template-columns: 1fr !important; grid-template-rows: 1fr 45vh; height: 100vh; height: 100dvh; }
    #splitter { display: none; }
    #chat-pane { border-left: none; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>
  <div id="app">
    <div id="article-pane">
      <div id="article-header">
        <h1 id="article-title">Loading…</h1>
        <p class="top-subnote">Wikipedia explorer — <a href="https://github.com/nlade-core/pages-lab-ai" target="_blank" rel="noopener">pages-lab-ai</a>, 15th page. Rendered from Wikipedia's own plain-text extract; ask the sidebar copilot anything about it.</p>
      </div>
      <figure id="lead-image" style="display:none;">
        <img id="lead-image-img" alt="">
        <figcaption id="lead-image-caption"></figcaption>
      </figure>
      <!-- Demo only, per explicit scope: real infobox HTML injected here,
           nowhere else (not the system prompt, not the chat sidebar) --
           see fetchInfoboxHtml/renderInfobox below. -->
      <div id="infobox-demo" style="display:none;"></div>
      <div id="article-intro"></div>
      <div id="article-body"></div>
      <p class="attribution" id="attribution" style="display:none;"></p>
    </div>

    <div id="splitter" title="Drag to resize"></div>

    <div id="chat-pane">
      <div id="chat-header">
        <h2>Ask about this article</h2>
        <div class="status-line">Prompt API: <span class="status-pill" id="status-pill">checking…</span></div>
      </div>
      <div id="chat-log"></div>
      <div id="chat-composer">
        <div class="row">
          <input type="text" id="chat-input" placeholder="Ask something…" disabled>
          <button id="chat-send-btn" disabled>Ask</button>
        </div>
        <div id="chat-note"></div>
      </div>
    </div>
  </div>

  <script type="module">
    // Pinned to an exact version deliberately, same reasoning as every
    // other CDN import across pages-lab-ai.
    import { marked } from 'https://cdn.jsdelivr.net/npm/marked@18.0.11/lib/marked.esm.js';

    const ARTICLE_TITLE = 'Eiffel Tower';

    const articleTitleEl = document.getElementById('article-title');
    const articleIntroEl = document.getElementById('article-intro');
    const articleBodyEl = document.getElementById('article-body');
    const attributionEl = document.getElementById('attribution');
    const leadImageEl = document.getElementById('lead-image');
    const leadImageImgEl = document.getElementById('lead-image-img');
    const leadImageCaptionEl = document.getElementById('lead-image-caption');
    const infoboxDemoEl = document.getElementById('infobox-demo');
    const statusPill = document.getElementById('status-pill');
    const chatLog = document.getElementById('chat-log');
    const chatInput = document.getElementById('chat-input');
    const chatSendBtn = document.getElementById('chat-send-btn');
    const chatNote = document.getElementById('chat-note');

    function escapeHtml(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
    // Escape first, then Markdown-parse the escaped text -- markdown's own
    // syntax never uses &, <, or >, so this doesn't break formatting, and
    // any literal HTML in the model's raw output renders as inert visible
    // text instead of executable markup. Same pattern as chrome-ai's own
    // chat demo, not something to solve differently here.
    function renderMarkdown(text) {
      return '<div class="md">' + marked.parse(escapeHtml(text)) + '</div>';
    }

    // --- Fetch + parse the article once. Plain-text extract, not HTML --
    // deliberately: this is the same data source the retrieval loop below
    // needs anyway (real section text on demand), so the reading pane and
    // the copilot share one source of truth instead of fetching the
    // article twice in two different formats.
    async function fetchArticle(title) {
      const res = await fetch('https://en.wikipedia.org/w/api.php?action=query&prop=extracts&explaintext=1&titles=' + encodeURIComponent(title) + '&format=json&origin=*');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const page = Object.values(data.query.pages)[0];
      const extract = page.extract || '';
      const { intro, tree } = parseArticleTree(extract);
      return { title: page.title, intro, tree };
    }

    // --- A single lead image, ported from chrome-chat's already-proven
    // `/wiki image` feature rather than built fresh. Simplified for this
    // page's actual need: chrome-chat fetches the image as a Blob because
    // it attaches it to a multimodal model prompt; this page only ever
    // displays it, so the media-list URL is used directly as an <img src>
    // -- no blob fetch, no blob-URL lifecycle to manage.
    //
    // The licensing check is unchanged and just as load-bearing here:
    // not every image on a Wikipedia page is freely licensed -- some are
    // hosted locally per-wiki under a fair-use rationale (confirmed real
    // via a non-Commons movie poster during chrome-chat's own build).
    // Wikimedia Commons (the `/wikipedia/commons/` URL path) forbids
    // fair-use-only hosting, so filtering to Commons-hosted images is a
    // real, checkable guarantee of free licensing, not an assumption.
    function isCommonsHosted(item) {
      const src = item.srcset && item.srcset[0] && item.srcset[0].src;
      return !!src && src.includes('/wikipedia/commons/');
    }
    async function fetchWikiLeadImage(title) {
      const res = await fetch('https://en.wikipedia.org/api/rest_v1/page/media-list/' + encodeURIComponent(title.replace(/ /g, '_')));
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const items = data.items || [];
      const candidates = items.filter((it) => it.type === 'image' && isCommonsHosted(it));
      const chosen = candidates.find((it) => it.leadImage) || candidates.find((it) => it.showInGallery);
      const entry = chosen && chosen.srcset && chosen.srcset[0];
      if (!entry) throw new Error('no freely-licensed (Commons) image found for this article');
      // Always use the exact URL media-list hands back -- confirmed live
      // (chrome-chat) that hand-constructing a different width returns a
      // Wikimedia error page, not an image; only specific pre-rendered
      // widths actually exist. The 2x entry (if present) is used as a
      // srcset hint for sharper rendering on high-DPI displays.
      const toAbsolute = (src) => (src.startsWith('//') ? 'https:' + src : src);
      const entry2x = chosen.srcset[1];
      const fileTitle = chosen.title.replace(/^File:/, '').replace(/_/g, ' ');
      return {
        imgUrl: toAbsolute(entry.src),
        imgUrl2x: entry2x ? toAbsolute(entry2x.src) : null,
        caption: fileTitle,
        commonsUrl: 'https://commons.wikimedia.org/wiki/' + encodeURIComponent(chosen.title.replace(/ /g, '_')),
      };
    }
    function renderLeadImage(img) {
      leadImageImgEl.src = img.imgUrl;
      leadImageImgEl.srcset = img.imgUrl2x ? img.imgUrl + ' 1x, ' + img.imgUrl2x + ' 2x' : '';
      leadImageImgEl.alt = img.caption;
      leadImageCaptionEl.innerHTML = escapeHtml(img.caption) + ' — <a href="' + img.commonsUrl + '" target="_blank" rel="noopener">via Wikimedia Commons</a>';
      leadImageEl.style.display = '';
    }

    // --- DEMO ONLY, explicitly scoped to the page render alone -- not
    // fed into the system prompt or the chat sidebar. Fetches the real
    // rendered infobox table from the full HTML endpoint (NOT the plain-
    // text extract everything else on this page uses) so the actual
    // visual infobox can be seen before deciding whether/how to progress
    // this past a spike. Confirmed live (this session's own research)
    // that Wikidata alone can't reconstruct several infobox fields (e.g.
    // a skyscraper's "preceded by/surpassed by" record-height relationship
    // isn't a Wikidata claim at all for the Eiffel Tower) -- this is the
    // only way to see that content at all.
    //
    // Real HTML from Wikipedia gets real sanitization before injection,
    // not blind trust -- this is a materially bigger trust surface than
    // the plain-text extract the rest of this page escapes and renders
    // itself: script/style elements, edit-section buttons, and footnote
    // superscripts (whose anchors don't exist on this page) are stripped;
    // every element's inline event-handler attributes are removed; and
    // relative links/protocol-relative images are rewritten to absolute
    // URLs so they still work from here. The interactive map widget
    // (`.mw-kartographer-map`) is also stripped -- it needs Wikipedia's
    // own mapping JS/service to render and would just show broken
    // without it, confirmed by inspecting the real markup before
    // deciding to strip it rather than leaving it in to fail silently.
    async function fetchInfoboxHtml(title) {
      const res = await fetch('https://en.wikipedia.org/api/rest_v1/page/html/' + encodeURIComponent(title.replace(/ /g, '_')));
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const html = await res.text();
      const doc = new DOMParser().parseFromString(html, 'text/html');
      const table = doc.querySelector('table.infobox');
      if (!table) throw new Error('no infobox found for this article');

      table.querySelectorAll('script, style, .mw-editsection, sup.reference, sup.noprint, .mw-kartographer-map, .mw-kartographer-maplink').forEach((el) => el.remove());
      table.querySelectorAll('*').forEach((el) => {
        [...el.attributes].forEach((attr) => { if (/^on/i.test(attr.name)) el.removeAttribute(attr.name); });
      });
      table.querySelectorAll('a[href]').forEach((a) => {
        const href = a.getAttribute('href');
        if (href.startsWith('./')) a.setAttribute('href', 'https://en.wikipedia.org/wiki/' + href.slice(2));
        else if (href.startsWith('/wiki/')) a.setAttribute('href', 'https://en.wikipedia.org' + href);
        else if (href.startsWith('#')) { a.removeAttribute('href'); return; } // in-page anchor that won't exist here
        a.setAttribute('target', '_blank');
        a.setAttribute('rel', 'noopener');
      });
      table.querySelectorAll('img[src^="//"]').forEach((img) => { img.setAttribute('src', 'https:' + img.getAttribute('src')); });
      table.querySelectorAll('img[srcset]').forEach((img) => {
        img.setAttribute('srcset', img.getAttribute('srcset').split(',').map((part) => part.trim().replace(/^\/\//, 'https://')).join(', '));
      });
      return table.outerHTML;
    }
    function renderInfobox(html) {
      infoboxDemoEl.innerHTML = html;
      infoboxDemoEl.style.display = '';
    }

    // --- Companion structured facts from Wikidata, entirely optional and
    // best-effort -- a failure here never blocks the article itself from
    // loading (see init() below, which catches this separately).
    //
    // This is now GENERIC, not a hand-picked property allowlist -- an
    // earlier version hardcoded 7 landmark-specific properties (height,
    // architect, materials...), confirmed live to be completely useless
    // for a non-landmark article (every one of the 7 was MISSING on Marie
    // Curie's Wikidata item). Instead, every property an item actually has
    // is kept UNLESS it's excluded by one of two generic rules, neither of
    // which requires knowing what kind of topic this is:
    //
    // 1. Datatype exclusion -- drop any property typed `external-id`,
    //    `url`, or `commonsMedia`. Measured live against the real Eiffel
    //    Tower item: this alone cuts 178 properties to 43, since the
    //    overwhelming majority of any item's properties are cross-
    //    reference IDs to other databases (GeoNames, Structurae, IMDb,
    //    etc.) or media/link properties, neither useful as text facts.
    // 2. A blocklist of properties Wikidata ITSELF formally classifies as
    //    being about the Wikidata/Wikimedia entry (or the subject's own
    //    online/social presence) rather than the real-world subject --
    //    queried live via SPARQL against four real Wikidata classes
    //    (Q103824108 "property about Wikidata entities themselves",
    //    Q18667213 "property about Wikimedia categories", Q18610173
    //    "property to link to Commons", Q30041186 "property related to
    //    online communities"), not hand-guessed. This catches things the
    //    datatype rule can't -- `maintained by WikiProject` (P6104),
    //    `topic's main category` (P910), `hashtag` (P2572), `social media
    //    followers` (P8687) -- none of them external-id/url/commonsMedia
    //    typed, all of them still noise. Generated once from that query,
    //    not fetched live per page load; worth periodically refreshing,
    //    not a one-time fact.
    const WIKIDATA_META_PROPERTY_BLOCKLIST = new Set([
      'P10', 'P10027', 'P10032', 'P10048', 'P10093', 'P10280', 'P10358', 'P10649', 'P10650', 'P10651',
      'P10696', 'P10756', 'P109', 'P10924', 'P10956', 'P11101', 'P11137', 'P11196', 'P11337', 'P11401',
      'P11559', 'P117', 'P11702', 'P11832', 'P11947', 'P1200', 'P12565', 'P12686', 'P12687', 'P12692',
      'P12849', 'P12981', 'P13146', 'P13162', 'P13236', 'P13362', 'P13390', 'P13392', 'P13632', 'P13642',
      'P13696', 'P13801', 'P13814', 'P14', 'P14387', 'P1442', 'P14511', 'P1464', 'P1465', 'P14687',
      'P1472', 'P1482', 'P15', 'P154', 'P1543', 'P158', 'P1612', 'P1621', 'P1740', 'P1753',
      'P1754', 'P1766', 'P1791', 'P1792', 'P18', 'P1801', 'P181', 'P1846', 'P1943', 'P1944',
      'P1963', 'P1997', 'P2033', 'P207', 'P2343', 'P242', 'P2425', 'P2517', 'P2572', 'P2713',
      'P2716', 'P2910', 'P2919', 'P2959', 'P301', 'P3030', 'P3265', 'P3311', 'P3383', 'P3417',
      'P3451', 'P367', 'P373', 'P3876', 'P3896', 'P3984', 'P4004', 'P4045', 'P4047', 'P41',
      'P4150', 'P4173', 'P4179', 'P4195', 'P4224', 'P4291', 'P4329', 'P443', 'P4640', 'P4656',
      'P4669', 'P4896', 'P491', 'P5008', 'P51', 'P5252', 'P5436', 'P5555', 'P5775', 'P5962',
      'P5996', 'P6104', 'P6112', 'P6186', 'P6365', 'P6655', 'P6802', 'P6900', 'P692', 'P7084',
      'P7457', 'P7561', 'P7703', 'P7782', 'P7861', 'P7867', 'P8195', 'P8204', 'P8265', 'P8464',
      'P8517', 'P8592', 'P8596', 'P8667', 'P8672', 'P8687', 'P8766', 'P8933', 'P8989', 'P9078',
      'P910', 'P9126', 'P9345', 'P935', 'P94', 'P948', 'P9664', 'P9675', 'P9694', 'P971',
      'P9721', 'P9819', 'P989', 'P990', 'P9906', 'P996', 'P998',
      // The formal query above isn't actually complete -- these two were
      // manually caught by eyeballing the raw Eiffel Tower dump BEFORE the
      // formal-classification approach existed, and confirmed live (via
      // this exact code, tested against the real API) to still slip
      // through all four formal classes. Added directly rather than
      // pretending the query alone was sufficient:
      'P1705', // native label -- monolingualtext, not classified under any of the 4 classes above
      'P1889', // different from -- classified only as a "symmetric property" (Q18647518), a LOGICAL trait shared with genuinely useful facts like spouse/sibling, so that whole class can't be blocklisted wholesale
      // Known further gaps, deliberately NOT added yet (documented, not
      // fixed, per explicit direction -- see the memory/README entry for
      // this session): `described by source` (P1343), `public domain
      // date` (P3893), and `offers view on` (P3173) are all still real
      // noise that slips through every rule above. `described by
      // source`'s own class (Q18608359, "property to indicate a
      // source") is NOT safe to blocklist wholesale the way the other
      // four are -- it also contains `author` (P50), `publisher`
      // (P123), and `publication date` (P577), which would be
      // genuinely useful top-level facts on a book's or film's own
      // Wikidata item. These three would need individual hand-adding,
      // same as P1705/P1889 above, not a 5th class.
    ]);

    // Label fallback order. An initial attempt measured this live (five
    // real gaps found across 213 entities referenced from four test
    // articles) but that sample was too small to responsibly rank
    // languages by -- discarded in favor of reasoning about it directly:
    // each additional language should cover topics a genuinely DIFFERENT
    // population of editors cares about, not just be another big
    // language that mostly re-covers what the previous picks already do.
    // `mul` goes first regardless of any language stats -- it's not "a
    // language that happened to cover a gap," it's Wikidata's own tag for
    // an entire CLASS of gap (a name/term that was never going to get a
    // real per-language translation in the first place, e.g. a person's
    // own name -- see resolveWikidataQid's structural-engineer case).
    // After that, `de`/`fr`/`es`/`ru`/`zh`/`ar`/`ja` were picked for being
    // both large, independent labeling communities AND covering
    // genuinely different scripts/geographies from each other (Central
    // Europe, the Francophone world, the Hispanophone world, the
    // Cyrillic sphere, East Asia via Chinese, the Arab world, and Japan
    // specifically since its Wikipedia/Wikidata community is large and
    // independently active despite partial script overlap with Chinese)
    // -- rather than adding e.g. Portuguese or Italian, whose coverage
    // likely overlaps heavily with Spanish/French already on the list.
    // Measured separately: requesting all 9 costs nothing meaningful --
    // ~27KB for a real 50-id batch (vs ~5KB for English alone), on a
    // fetch that only ever happens once per page load, not per question.
    const WIKIDATA_LABEL_LANGUAGES = ['en', 'mul', 'de', 'fr', 'es', 'ru', 'zh', 'ar', 'ja'];
    const WIKIDATA_LABEL_LANGUAGES_PARAM = WIKIDATA_LABEL_LANGUAGES.join('|');

    function pickLabel(labelsObj) {
      if (!labelsObj) return null;
      for (const lang of WIKIDATA_LABEL_LANGUAGES) {
        if (labelsObj[lang]) return labelsObj[lang].value;
      }
      return null;
    }

    async function resolveWikidataQid(title) {
      const res = await fetch('https://en.wikipedia.org/w/api.php?action=query&prop=pageprops&ppprop=wikibase_item&titles=' + encodeURIComponent(title) + '&format=json&origin=*');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const page = Object.values(data.query.pages)[0];
      const qid = page.pageprops && page.pageprops.wikibase_item;
      if (!qid) throw new Error('no linked Wikidata item for this article');
      return qid;
    }

    // Wikidata's own mechanism for "which of several conflicting values is
    // the real one": prefer any statement explicitly marked `preferred`;
    // otherwise fall back to every non-deprecated (`normal`) one, since
    // most properties here only ever have normal-rank statements at all.
    function bestRankClaims(claims) {
      const preferred = claims.filter((c) => c.rank === 'preferred');
      return preferred.length ? preferred : claims.filter((c) => c.rank !== 'deprecated');
    }

    // Fetches entity data (labels, and optionally datatype) for up to
    // several hundred ids in batches of 50 -- `wbgetentities`'s real limit
    // -- and returns a flat {id: entity} map. A single malformed id
    // anywhere in a batch breaks that ENTIRE batch (confirmed live: one
    // bad id returns a top-level error object with no `entities` key at
    // all) -- callers are responsible for only passing well-formed ids in.
    async function batchFetchWikidataEntities(ids, props) {
      const out = {};
      for (let i = 0; i < ids.length; i += 50) {
        const chunk = ids.slice(i, i + 50);
        const res = await fetch('https://www.wikidata.org/w/api.php?action=wbgetentities&ids=' + chunk.join('|') + '&props=' + props + '&languages=' + WIKIDATA_LABEL_LANGUAGES_PARAM + '&format=json&origin=*');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        Object.assign(out, data.entities);
      }
      return out;
    }

    // A raw claim value comes in one of several real shapes, not just
    // plain strings -- caught live testing this against the actual data:
    // "floors above ground" is a Quantity (`{amount, unit}`), same shape
    // as height, not a bare number -- an earlier version's naive
    // `String(dv)` fallback rendered it as the literal text
    // "[object Object]" instead of the number. Testing against two more
    // genuinely different articles (monster truck, sandwich) surfaced two
    // MORE shapes the same way: monolingualtext (`{text, language}`, e.g.
    // "native label") and globe-coordinate (`{latitude, longitude}`, e.g.
    // "coordinate location") -- both hit the exact same "[object Object]"
    // bug before being added here explicitly.
    //
    // Wikidata represents a dimensionless quantity's unit as the bare
    // string "1", not a real entity -- caught live testing "floors above
    // ground" (a plain count, no unit): treating "1" as a Q-id to resolve
    // broke the ENTIRE batched labels call, not just that one value.
    function realUnitQid(dv) {
      const raw = dv.unit && dv.unit.split('/').pop();
      return (raw && raw !== '1') ? raw : null;
    }

    // Confirms an id is really a Wikidata ITEM reference (Q123) before
    // trusting it as one -- caught live testing "sandwich": one property
    // ("EntitySchema for this class") had a value of literal "E204", a
    // Wikidata EntitySchema reference, not an item. Treating it as a Q-id
    // to resolve broke the ENTIRE labels batch for that request -- same
    // failure class as the "1" unit bug above, just via a different kind
    // of non-item id slipping into the same collection logic, and only
    // surfaced by testing an article the earlier two didn't cover.
    function isWikidataItemId(id) {
      return /^Q\d+$/.test(id);
    }

    function formatWikidataValue(dv, valueEntities) {
      if (dv.id && isWikidataItemId(dv.id)) {
        const label = valueEntities[dv.id] && pickLabel(valueEntities[dv.id].labels);
        return label || dv.id; // no label in any tried language -- show the raw id rather than hide the fact entirely
      }
      if (dv.id) return dv.id; // a non-item id (e.g. an EntitySchema reference) -- shown as-is, never sent for label resolution
      if (dv.amount !== undefined) { // quantity, e.g. height, floor count
        const amount = dv.amount.replace(/^\+/, '');
        const unitQid = realUnitQid(dv);
        const unitLabel = unitQid && valueEntities[unitQid] && pickLabel(valueEntities[unitQid].labels);
        return unitLabel ? amount + ' ' + unitLabel : amount;
      }
      if (dv.time) return dv.time.replace(/^\+/, '').split('T')[0]; // ISO date, precision ignored -- not currently surfaced (see the excluded inception/date properties above)
      if (dv.text !== undefined) return dv.text; // monolingualtext, e.g. native label
      if (dv.latitude !== undefined) return dv.latitude + ', ' + dv.longitude; // globe-coordinate
      return String(dv);
    }

    // Some properties (e.g. a well-decorated person's "award received")
    // can carry a long tail of values -- capped per property so one busy
    // property can't dominate the whole fact block's size.
    const MAX_VALUES_PER_FACT = 5;

    // Returns a flat [{label, value}] list, or [] if anything about this
    // fails -- callers treat this as pure enrichment, never a hard
    // requirement.
    async function fetchWikidataFacts(title) {
      const qid = await resolveWikidataQid(title);
      const res = await fetch('https://www.wikidata.org/wiki/Special:EntityData/' + qid + '.json');
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const claims = data.entities[qid].claims;

      const propIds = Object.keys(claims);
      const propEntities = await batchFetchWikidataEntities(propIds, 'datatype|labels');

      const keptPids = propIds.filter((pid) => {
        const dt = propEntities[pid] && propEntities[pid].datatype;
        if (dt === 'external-id' || dt === 'url' || dt === 'commonsMedia') return false;
        if (WIKIDATA_META_PROPERTY_BLOCKLIST.has(pid)) return false;
        return true;
      });

      // Item-type values and quantity units both need their own label
      // lookup (e.g. architect -> Q778243, not "Stephen Sauvestre") --
      // batched into as few requests as possible, separate from the
      // property lookup above since these are entities, not properties.
      const idsToResolve = new Set();
      keptPids.forEach((pid) => {
        bestRankClaims(claims[pid] || []).forEach((c) => {
          const dv = c.mainsnak.datavalue && c.mainsnak.datavalue.value;
          if (!dv) return;
          if (dv.id && isWikidataItemId(dv.id)) idsToResolve.add(dv.id); // non-item ids (e.g. an EntitySchema ref) are never sent for resolution -- see isWikidataItemId's comment
          const unitQid = realUnitQid(dv);
          if (unitQid) idsToResolve.add(unitQid);
        });
      });
      const valueEntities = await batchFetchWikidataEntities([...idsToResolve], 'labels');

      const facts = [];
      keptPids.forEach((pid) => {
        const plabel = pickLabel(propEntities[pid].labels) || pid;
        const values = bestRankClaims(claims[pid] || []).map((c) => {
          const dv = c.mainsnak.datavalue && c.mainsnak.datavalue.value;
          return dv ? formatWikidataValue(dv, valueEntities) : null;
        }).filter(Boolean).slice(0, MAX_VALUES_PER_FACT);
        if (values.length) facts.push({ label: plabel, value: values.join(', ') });
      });
      return facts;
    }

    // --- A real parent/child tree, not a flat list with a level number
    // bolted on. This matters for two reasons: (1) a subsection's own text
    // is often thin -- the real content usually lives one level deeper --
    // so injecting "a section" should mean its whole subtree, not just its
    // own paragraph; (2) two different subsections that happen to share a
    // name (e.g. two "Overview"s under different parents) need their path
    // to tell them apart, which a flat list can't express. ---
    function parseArticleTree(extract) {
      const lines = extract.split('\n');
      const root = { title: null, level: 1, ownText: '', children: [] };
      const stack = [root];
      let intro = '';
      for (const line of lines) {
        const m = line.match(/^(={2,6})\s*(.+?)\s*\1$/);
        if (m) {
          const level = m[1].length;
          while (stack.length > 1 && stack[stack.length - 1].level >= level) stack.pop();
          const node = { title: m[2].trim(), level, ownText: '', children: [] };
          stack[stack.length - 1].children.push(node);
          stack.push(node);
        } else if (stack.length > 1) {
          // Every non-blank line is one whole paragraph, always -- the
          // API is inconsistent about whether a blank line separates two
          // paragraphs (confirmed live: the "Origin" subsection has one,
          // but "Construction" doesn't -- three consecutive paragraph
          // lines with no blank line between any of them at all), so
          // blank lines can't be trusted as the real delimiter anywhere,
          // not just in the intro. An earlier version joined section-body
          // lines with a single \n, correct only for the sections that
          // happened to have blank-line separators, and silently
          // collapsed multi-paragraph sections that didn't (like
          // Construction) into one block -- caught only because a real
          // person compared the render against the actual Wikipedia
          // article, not by any automated check. Fixed the same way as
          // the intro below: skip blank lines outright, join every real
          // line with \n\n.
          if (line.trim()) {
            const top = stack[stack.length - 1];
            top.ownText += (top.ownText ? '\n\n' : '') + line;
          }
        } else if (line.trim()) {
          intro += (intro ? '\n\n' : '') + line;
        }
      }
      // Citations/links-only tail sections aren't useful reading or
      // retrieval content -- stop there, same convention as chrome-chat's
      // /wiki full. Only checked at the top level; a nested section that
      // happens to share one of these names is left alone.
      const stop = ['See also', 'References', 'External links', 'Notes', 'Further reading', 'Bibliography'];
      const stopIdx = root.children.findIndex((s) => stop.includes(s.title));
      const kept = stopIdx === -1 ? root.children : root.children.slice(0, stopIdx);
      kept.forEach(annotateCounts);
      return { intro: intro.trim(), tree: kept };
    }

    // Own text length, and a total including every descendant -- the
    // total is what actually gets pasted into the model's context when
    // this node is chosen (see getSubtreeText), so that's the number that
    // matters for judging how much a retrieval hop will cost. Own count
    // is kept too, as the natural seed for chunking a section later if an
    // article ever has one large enough to need it.
    function annotateCounts(node) {
      node.ownCharCount = node.ownText.length;
      node.totalCharCount = node.ownCharCount + node.children.reduce((sum, c) => sum + annotateCounts(c), 0);
      return node.totalCharCount;
    }

    function renderNode(node) {
      const tag = 'h' + Math.min(node.level, 4);
      const body = node.ownText.split('\n\n').filter(Boolean).map((p) => '<p>' + escapeHtml(p) + '</p>').join('');
      const childHtml = node.children.map(renderNode).join('');
      return '<' + tag + '>' + escapeHtml(node.title) + '</' + tag + '>' + body + childHtml;
    }

    function renderArticle(article) {
      articleTitleEl.textContent = article.title;
      articleIntroEl.innerHTML = article.intro.split('\n\n').map((p) => '<p>' + escapeHtml(p) + '</p>').join('');
      articleBodyEl.innerHTML = article.tree.map(renderNode).join('');
      attributionEl.innerHTML = 'Content from <a href="https://en.wikipedia.org/wiki/' + encodeURIComponent(article.title.replace(/ /g, '_')) + '" target="_blank" rel="noopener">Wikipedia: ' + escapeHtml(article.title) + '</a>, available under the <a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener">CC BY-SA 4.0</a> license.';
      attributionEl.style.display = 'block';
    }

    // --- The retrieval loop. Gemini Nano has no native tool-calling, so
    // this is hand-rolled in stages: try the summary alone first: only
    // if that's not enough does the model see the section tree at all,
    // and only the specific subtree(s) it picks ever get their full text
    // injected. ---
    const RANK_COUNT = 3;

    // `facts` (from fetchWikidataFacts) is always folded in here rather
    // than treated as its own escalation stage -- unlike a full section's
    // prose, a handful of curated structured facts is only a couple
    // hundred tokens, negligible against Nano's ~9,216-token window, so
    // there's no size problem to justify making the model ask for it.
    //
    // Section TITLES (not their content) are folded in too -- a real
    // reconsideration, not the original design: the earlier version kept
    // these out of the system prompt entirely, reasoning purely about
    // single-question retrieval cost (why show a title list a question
    // might not need?). That missed a different, real value: a model
    // aware of the full topic map from turn one can reference or suggest
    // sections proactively across a conversation, not just react to one
    // question at a time -- and a bare title list (no char counts, those
    // stay ranking-only) costs the same negligible ~200-300 tokens this
    // family already measured cheap elsewhere. The escalation mechanism
    // for pulling a section's real TEXT is unchanged -- this only adds
    // awareness of what exists, not the content itself.
    function buildSystemPrompt(article, facts) {
      const factLines = (facts && facts.length)
        ? '\n\nKnown facts:\n' + facts.map((f) => '- ' + f.label + ': ' + f.value).join('\n')
        : '';
      const sectionLines = '\n\nSections in this article (titles only -- ask and I\'ll look one up if needed):\n'
        + flattenWithPaths(article.tree).map((f) => '- ' + f.path.join(' > ')).join('\n');
      return 'You are a helpful assistant answering questions about the Wikipedia article "' + article.title + '".\n\n'
        + 'Summary:\n' + article.intro + factLines + sectionLines + '\n\n'
        + 'Try to answer the user\'s question using the summary and known facts alone. If you can answer it confidently and directly, just answer normally.\n\n'
        + 'If that genuinely isn\'t enough to answer well, respond with EXACTLY this and nothing else:\n'
        + 'NEED_MORE_INFO';
    }

    // Flattened on demand from the tree, not stored redundantly -- the
    // tree stays the one source of truth. `path` is the full ancestor
    // chain (including the node's own title), used both for showing the
    // model real hierarchy when ranking and for disambiguating same-named
    // subsections under different parents.
    function flattenWithPaths(nodes, ancestors) {
      ancestors = ancestors || [];
      let out = [];
      for (const node of nodes) {
        const path = ancestors.concat([node.title]);
        out.push({ node, path });
        out = out.concat(flattenWithPaths(node.children, path));
      }
      return out;
    }

    // The full text of a node and everything nested under it, rendered
    // back out with the same == heading markers the source extract used
    // -- so a subsection's own heading, and any of ITS children, stay
    // visibly structured rather than arriving as one flat undifferentiated
    // block of text.
    function getSubtreeText(node) {
      const marker = '='.repeat(Math.min(node.level, 6));
      let text = marker + ' ' + node.title + ' ' + marker + (node.ownText ? '\n' + node.ownText : '');
      for (const child of node.children) {
        text += '\n\n' + getSubtreeText(child);
      }
      return text;
    }

    function findNode(flatList, requestedTitle) {
      const norm = requestedTitle.trim().toLowerCase();
      let hit = flatList.find((f) => f.path.join(' > ').toLowerCase() === norm);
      if (hit) return hit;
      hit = flatList.find((f) => f.node.title.toLowerCase() === norm);
      if (hit) return hit;
      return flatList.find((f) => f.node.title.toLowerCase().includes(norm) || norm.includes(f.node.title.toLowerCase()));
    }

    function buildRankingPrompt(question, flatList) {
      const lines = flatList.map((f) => '- ' + f.path.join(' > ') + ' (~' + f.node.totalCharCount + ' chars)');
      return 'The summary wasn\'t enough to answer this question: "' + question + '"\n\n'
        + 'Here are the article\'s sections, with a rough size in characters:\n' + lines.join('\n') + '\n\n'
        + 'List up to ' + RANK_COUNT + ' sections most likely to contain the answer, in priority order, using their exact names from the list above (fewer than ' + RANK_COUNT + ' is fine if fewer seem relevant). Respond with EXACTLY this format and nothing else:\n'
        + 'RANK: <first choice> | <second choice> | <third choice>';
    }

    function parseRankResponse(response, flatList) {
      const m = response.match(/^RANK:\s*(.+)$/is);
      if (!m) return [];
      const names = m[1].split('|').map((s) => s.trim()).filter(Boolean).slice(0, RANK_COUNT);
      const hits = [];
      for (const name of names) {
        const hit = findNode(flatList, name);
        if (hit && !hits.includes(hit)) hits.push(hit);
      }
      return hits;
    }

    // --- Resizable article/chat split. Grid column widths, not flex-basis,
    // since #app is already a grid (see the scroll-bug comment above) --
    // keeping one layout mechanism for the outer shell rather than mixing
    // in a second. Persisted so a visitor's preferred split survives a
    // reload, same convenience as everything else in this family that
    // remembers state in localStorage. ---
    const splitter = document.getElementById('splitter');
    const app = document.getElementById('app');
    const CHAT_WIDTH_KEY = 'wiki-explore:chat-width-px';
    const SPLITTER_W = 6;
    const MIN_CHAT = 260;
    const MIN_ARTICLE = 320;

    function clampChatWidth(px) {
      const maxChat = window.innerWidth - MIN_ARTICLE - SPLITTER_W;
      return Math.max(MIN_CHAT, Math.min(px, Math.max(MIN_CHAT, maxChat)));
    }
    function applyChatWidth(px) {
      app.style.gridTemplateColumns = '1fr ' + SPLITTER_W + 'px ' + px + 'px';
    }
    (function restoreChatWidth() {
      const saved = parseInt(localStorage.getItem(CHAT_WIDTH_KEY), 10);
      if (!Number.isNaN(saved)) applyChatWidth(clampChatWidth(saved));
    })();

    let dragStartX = null;
    let dragStartWidth = null;
    function beginDrag(clientX) {
      if (window.innerWidth <= 800) return;
      dragStartX = clientX;
      dragStartWidth = document.getElementById('chat-pane').getBoundingClientRect().width;
      splitter.classList.add('dragging');
      document.body.style.userSelect = 'none';
    }
    function duringDrag(clientX) {
      if (dragStartX === null) return;
      const delta = dragStartX - clientX;
      applyChatWidth(clampChatWidth(dragStartWidth + delta));
    }
    function endDrag() {
      if (dragStartX === null) return;
      dragStartX = null;
      splitter.classList.remove('dragging');
      document.body.style.userSelect = '';
      const rect = document.getElementById('chat-pane').getBoundingClientRect();
      localStorage.setItem(CHAT_WIDTH_KEY, String(Math.round(rect.width)));
    }
    splitter.addEventListener('mousedown', (e) => { beginDrag(e.clientX); e.preventDefault(); });
    window.addEventListener('mousemove', (e) => duringDrag(e.clientX));
    window.addEventListener('mouseup', endDrag);
    splitter.addEventListener('touchstart', (e) => beginDrag(e.touches[0].clientX), { passive: true });
    window.addEventListener('touchmove', (e) => duringDrag(e.touches[0].clientX), { passive: true });
    window.addEventListener('touchend', endDrag);

    function addMessage(role, text) {
      const row = document.createElement('div');
      row.className = 'msg ' + role;
      row.innerHTML = '<span class="role">' + role + '</span>' + renderMarkdown(text);
      chatLog.appendChild(row);
      chatLog.scrollTop = chatLog.scrollHeight;
    }
    // Shown as soon as the article is fetched/parsed (see init() below --
    // deliberately not gated on the model finishing its own, possibly much
    // slower, load). The model only ever sees the summary up front in its
    // own system prompt (section titles are shown later, only if a
    // question actually escalates to ranking -- see buildSystemPrompt
    // above), so this is the visitor's one guaranteed look at the full
    // section map regardless of whether their questions ever trigger that
    // escalation. Both collapsed by default -- neither is required
    // reading to start chatting, so nothing forces itself on screen
    // unopened. The markup stays real HTML (not run through
    // renderMarkdown/marked) since it's plain Wikipedia text, not model
    // output that needs markdown parsing. Nested <ul>s mirror the real
    // tree, not a flattened dump -- a subsection renders indented under
    // its parent instead of appearing as just another same-level bullet.
    function renderSectionList(nodes) {
      return '<ul>' + nodes.map((n) => '<li>' + escapeHtml(n.title) + (n.children.length ? renderSectionList(n.children) : '') + '</li>').join('') + '</ul>';
    }
    function renderFactsList(facts) {
      return '<ul>' + facts.map((f) => '<li><strong>' + escapeHtml(f.label) + ':</strong> ' + escapeHtml(f.value) + '</li>').join('') + '</ul>';
    }
    function addStarterMessage(article, facts) {
      const introHtml = article.intro.split('\n\n').filter(Boolean).map((p) => '<p>' + escapeHtml(p) + '</p>').join('');
      const totalCount = flattenWithPaths(article.tree).length;
      // The facts dropdown only shows up at all if any facts actually came
      // back -- Wikidata enrichment is best-effort (see fetchWikidataFacts),
      // so a visitor never sees an empty "Known facts" shell on a load
      // where it failed or came back empty.
      const factsDetails = (facts && facts.length)
        ? '<details><summary>Known facts (' + facts.length + ')</summary>' + renderFactsList(facts) + '</details>'
        : '';
      // Order: Summary and Known facts are both "the quick answer, no
      // digging required" -- grouped together, with Sections (not an
      // answer, a map of what's available to go deeper on) last. Matches
      // the system prompt's own order above, not just this display.
      const html = '<p>I\'ve loaded <strong>' + escapeHtml(article.title) + '</strong> -- ask me anything, or check what I know below:</p>'
        + '<details><summary>Summary</summary>' + introHtml + '</details>'
        + factsDetails
        + '<details><summary>Sections (' + totalCount + ')</summary>' + renderSectionList(article.tree) + '</details>';
      const row = document.createElement('div');
      row.className = 'msg starter';
      row.innerHTML = '<div class="md">' + html + '</div>';
      chatLog.appendChild(row);
      chatLog.scrollTop = chatLog.scrollHeight;
    }
    function addSectionNote(text) {
      const row = document.createElement('div');
      row.className = 'msg section-note';
      row.textContent = text;
      chatLog.appendChild(row);
      chatLog.scrollTop = chatLog.scrollHeight;
    }

    let session = null;
    let article = null;

    // v1 deliberately uses non-streaming prompt() throughout, not
    // promptStreaming(). Streaming would mean rendering chunks live as
    // they arrive -- but a marker like NEED_MORE_INFO or RANK: looks
    // identical to the start of a real answer until enough of it has
    // streamed in, risking raw control text flashing on screen before the
    // app catches it. Waiting for the complete response first makes every
    // marker check unambiguous. Real streaming is a follow-up once this
    // retrieval logic itself is proven out, not something to solve at
    // the same time.
    //
    // Three stages, escalating only as far as needed:
    //   0. The question goes in with just the summary in context (already
    //      in the system prompt). Most questions stop here.
    //   1. If the model says NEED_MORE_INFO, it's shown the full section
    //      tree (titles + rough sizes, not content) and asked to rank the
    //      top few most likely to help.
    //   2. Those ranked sections are injected one at a time, most likely
    //      first, checking after each whether that's now enough to
    //      answer -- stopping as soon as it is, and forcing a final
    //      answer once the last rank is exhausted so this can never dead-
    //      end without a response.
    async function askQuestion(question) {
      chatInput.value = '';
      chatSendBtn.disabled = true;
      chatInput.disabled = true;
      addMessage('user', question);
      chatNote.textContent = 'Checking the summary…';
      try {
        const response = await session.prompt(question);
        if (!/^NEED_MORE_INFO\b/i.test(response.trim())) {
          addMessage('assistant', response);
          chatNote.textContent = '';
        } else {
          await escalate(question);
        }
      } catch (e) {
        chatNote.textContent = 'Error: ' + e.message;
      }
      chatSendBtn.disabled = false;
      chatInput.disabled = false;
      chatInput.focus();
    }

    async function escalate(question) {
      addSectionNote('Summary alone wasn\'t enough -- checking which sections might help…');
      chatNote.textContent = 'Ranking sections…';
      const flatList = flattenWithPaths(article.tree);
      const rankResponse = await session.prompt(buildRankingPrompt(question, flatList));
      const ranked = parseRankResponse(rankResponse, flatList);

      let finalResponse;
      if (ranked.length === 0) {
        addSectionNote('No clear section match -- answering with what\'s available.');
        finalResponse = await session.prompt('There\'s no specific section to point to for this. Please answer as best you can with what you already know: ' + question);
      } else {
        for (let i = 0; i < ranked.length; i++) {
          const { node, path } = ranked[i];
          const pathStr = path.join(' > ');
          const isLast = i === ranked.length - 1;
          addSectionNote('Checking "' + pathStr + '" (' + (i + 1) + '/' + ranked.length + ')…');
          chatNote.textContent = 'Checking "' + pathStr + '"…';
          const sectionBlock = 'Section path: ' + pathStr + '\n\n' + getSubtreeText(node);
          const prompt = isLast
            ? sectionBlock + '\n\nNow answer the original question as best you can using everything you\'ve seen so far: ' + question
            : sectionBlock + '\n\nDoes this let you answer the original question ("' + question + '") satisfactorily?\nIf yes, respond with EXACTLY: ANSWER: <your answer>\nIf not, respond with EXACTLY: NEED_MORE_INFO (and nothing else).';
          const stepResponse = await session.prompt(prompt);
          if (isLast) { finalResponse = stepResponse; break; }
          const ansMatch = stepResponse.match(/^ANSWER:\s*([\s\S]+)$/i);
          finalResponse = ansMatch ? ansMatch[1].trim() : stepResponse;
          if (ansMatch) break;
        }
      }
      addMessage('assistant', finalResponse);
      chatNote.textContent = '';
    }

    async function init() {
      let facts = [];
      try {
        // Wikidata enrichment runs alongside the article fetch (it only
        // needs the title, not the fetched article), but its own failure
        // is swallowed right here and never allowed to fail the article
        // load -- it's pure enrichment, not a requirement. Logged to the
        // console rather than shown to the visitor, same as any other
        // best-effort background enhancement.
        const [articleResult, factsResult, imageResult, infoboxHtmlResult] = await Promise.all([
          fetchArticle(ARTICLE_TITLE),
          fetchWikidataFacts(ARTICLE_TITLE).catch((e) => { console.warn('Wikidata facts unavailable:', e.message); return []; }),
          fetchWikiLeadImage(ARTICLE_TITLE).catch((e) => { console.warn('Lead image unavailable:', e.message); return null; }),
          fetchInfoboxHtml(ARTICLE_TITLE).catch((e) => { console.warn('Infobox demo unavailable:', e.message); return null; }),
        ]);
        article = articleResult;
        facts = factsResult;
        renderArticle(article);
        if (imageResult) renderLeadImage(imageResult);
        if (infoboxHtmlResult) renderInfobox(infoboxHtmlResult);
        // Shown the moment the (fast) Wikipedia fetch is parsed -- doesn't
        // wait on the model, which can take much longer if it needs a
        // fresh download. The same summary/tree/facts still get fed to
        // the model as its priming context below; this just means the
        // visitor isn't staring at a blank chat pane in the meantime.
        addStarterMessage(article, facts);
      } catch (e) {
        articleTitleEl.textContent = 'Failed to load article';
        chatNote.textContent = 'Error loading article: ' + e.message;
        return;
      }

      if (!self.LanguageModel) {
        statusPill.className = 'status-pill unavailable';
        statusPill.textContent = 'not in this browser';
        chatNote.textContent = 'The Prompt API isn\'t available in this browser.';
        return;
      }
      try {
        const availability = await LanguageModel.availability();
        if (availability === 'unavailable') {
          statusPill.className = 'status-pill unavailable';
          statusPill.textContent = 'unavailable';
          chatNote.textContent = 'The Prompt API is unavailable on this device.';
          return;
        }
        statusPill.className = 'status-pill ' + (availability === 'available' ? 'available' : 'downloadable');
        statusPill.textContent = availability === 'downloadable' ? 'needs download' : availability;

        chatNote.textContent = 'Preparing the model…';
        session = await LanguageModel.create({
          initialPrompts: [{ role: 'system', content: buildSystemPrompt(article, facts) }],
          monitor(m) {
            m.addEventListener('downloadprogress', (e) => {
              chatNote.textContent = 'Downloading model… ' + Math.round(e.loaded * 100) + '%';
            });
          },
        });
        chatNote.textContent = '';
        chatInput.disabled = false;
        chatSendBtn.disabled = false;
        chatInput.focus();
      } catch (e) {
        chatNote.textContent = 'Could not start the model: ' + e.message;
      }
    }

    chatSendBtn.addEventListener('click', () => {
      const q = chatInput.value.trim();
      if (q && session) askQuestion(q);
    });
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        const q = chatInput.value.trim();
        if (q && session) askQuestion(q);
      }
    });

    init();
  </script>
</body>
</html>
